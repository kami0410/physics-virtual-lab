<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
:root { --paper:#f2f4f0; --grid:#d3e2d7; --grid-strong:#b9d0c0; --ink:#1d2832; --ink-2:#4b5963; --ink-3:#85919a; --laser:#c41e3a; --enamel-3:#2c3631;
  --serif:"Noto Serif SC","Source Han Serif SC",serif; --sans:"Microsoft YaHei","Noto Sans SC",sans-serif; --mono:"IBM Plex Mono","Cascadia Mono",Consolas,monospace; }
html,body { margin:0; overflow:hidden; }
body { background-color:var(--paper); color:var(--ink); font-family:var(--sans); position:relative;
  background-image: linear-gradient(var(--grid-strong) 1px, transparent 1px), linear-gradient(90deg, var(--grid-strong) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px; background-position:-1px -1px; }
.eyebrow { font-size:26px; letter-spacing:.36em; color:var(--ink-2); }
h1 { font-family:var(--serif); font-weight:900; margin:0; line-height:1.14; letter-spacing:.04em; }
h1 em { font-style:normal; color:var(--laser); }
.big { font-family:var(--mono); font-weight:700; color:var(--ink); line-height:.9; }
.big small { display:block; font-family:var(--serif); font-weight:900; letter-spacing:.12em; color:var(--ink-2); }
.tile { position:absolute; overflow:hidden; background:#111; box-shadow:0 0 0 3px var(--enamel-3), 0 18px 40px rgba(20,30,25,.30); border-radius:6px; }
.tile img { width:100%; height:100%; object-fit:cover; display:block; }
.tile span { position:absolute; left:0; bottom:0; background:rgba(242,244,240,.95); color:var(--ink); font-family:var(--serif); font-weight:900; letter-spacing:.08em; padding:8px 16px 8px 14px; border-top:3px solid var(--laser); }
.chips { position:absolute; display:flex; gap:14px; }
.chips div { background:var(--ink); color:var(--paper); padding:10px 20px; letter-spacing:.08em; border-radius:3px; }
.chips div.r { background:var(--laser); }
.name { position:absolute; font-family:var(--mono); color:var(--ink-2); letter-spacing:.04em; }

/* 4:3 · 1440×1080 */
body.h { width:1440px; height:1080px; }
.h .eyebrow { position:absolute; left:80px; top:70px; }
.h h1 { position:absolute; left:76px; top:120px; font-size:120px; }
.h .big { position:absolute; right:84px; top:118px; font-size:210px; text-align:right; }
.h .big small { font-size:44px; margin-top:14px; }
.h .t1 { left:80px; top:440px; width:820px; height:470px; }
.h .t2 { left:940px; top:440px; width:420px; height:225px; }
.h .t3 { left:940px; top:685px; width:420px; height:225px; }
.h .tile span { font-size:28px; }
.h .chips { left:80px; top:952px; font-size:28px; }
.h .name { right:80px; top:962px; font-size:26px; }

/* 3:4 · 1080×1440 */
body.v { width:1080px; height:1440px; }
.v .eyebrow { position:absolute; left:70px; top:70px; font-size:24px; }
.v h1 { position:absolute; left:66px; top:116px; font-size:116px; }
.v .big { position:absolute; left:70px; top:430px; font-size:150px; display:flex; align-items:flex-end; gap:20px; }
.v .big small { display:inline; font-size:46px; margin-bottom:14px; }
.v .t1 { left:70px; top:620px; width:940px; height:420px; }
.v .t2 { left:70px; top:1070px; width:455px; height:225px; }
.v .t3 { left:555px; top:1070px; width:455px; height:225px; }
.v .tile span { font-size:28px; }
.v .chips { left:70px; top:1335px; font-size:28px; }
.v .name { right:70px; top:512px; font-size:25px; text-align:right; }
</style></head>
<body>
<div class="eyebrow">力学 · 热学 · 电磁学 · 光学 · 近代物理</div>
<h1>大学物理实验<br><em>虚拟仿真</em>实验室</h1>
<div class="big">64<small>个实验</small></div>
<div class="tile t1"><img id="i1"><span>迈克尔逊 · 白光干涉</span></div>
<div class="tile t2"><img id="i2"><span>电子荷质比</span></div>
<div class="tile t3"><img id="i3"><span>蛇摆</span></div>
<div class="chips"><div class="r">免费</div><div>浏览器打开即用</div><div>可离线</div></div>
<div class="name">kami0410 / physics-virtual-lab</div>
<script>
const q = new URLSearchParams(location.search);
document.body.className = q.get('r') === '34' ? 'v' : 'h';
const set = (id, src, pos) => { const i = document.getElementById(id); i.src = src; i.style.objectPosition = pos; };
set('i1', 'covers/h_mwhite.jpg', q.get('p1') || '50% 55%');
set('i2', 'covers/h_emratio.jpg', q.get('p2') || '42% 40%');
set('i3', 'covers/h_snake.jpg', q.get('p3') || '45% 70%');
</script>
</body></html>
