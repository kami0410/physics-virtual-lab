<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
:root { --paper:#f2f4f0; --grid:#d3e2d7; --grid-strong:#b9d0c0; --ink:#1d2832; --ink-2:#4b5963; --ink-3:#85919a; --laser:#c41e3a; --enamel:#4b5a53;
  --serif:"Noto Serif SC","Source Han Serif SC",serif; --sans:"Microsoft YaHei","Noto Sans SC",sans-serif; --mono:"IBM Plex Mono","Cascadia Mono",Consolas,monospace; }
html,body { margin:0; width:1920px; height:1080px; overflow:hidden; }
body { background-color:var(--paper); color:var(--ink); font-family:var(--sans);
  background-image: linear-gradient(var(--grid-strong) 1px, transparent 1px), linear-gradient(90deg, var(--grid-strong) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px; background-position: -1px -1px; }
body.clear { background: transparent; }
.card { position:absolute; inset:0; display:none; }
.on { display:block; }
.a { opacity:0; will-change: opacity, transform; }
/* 片头 */
#title .text { position:absolute; left:180px; top:290px; }
#title h1 { font-size:112px; }
.eyebrow { font-size:24px; letter-spacing:.42em; color:var(--ink-2); margin-bottom:34px; }
h1 { font-family:var(--serif); font-weight:900; font-size:132px; line-height:1.12; margin:0; letter-spacing:.05em; }
h1 em { font-style:normal; color:var(--laser); }
.rule { height:4px; background:var(--ink); width:0; margin:52px 0 34px; }
.sub { font-size:30px; color:var(--ink-2); letter-spacing:.12em; }
.eye { position:absolute; right:170px; top:270px; width:520px; height:520px; border-radius:50%;
  background:#3f4943; box-shadow: 0 30px 60px rgba(20,30,25,.28), inset 0 0 0 3px #59655e; }
.eye canvas { position:absolute; left:26px; top:26px; width:468px; height:468px; border-radius:50%; }
.eye .cap { position:absolute; left:50%; bottom:-58px; transform:translateX(-50%); font-family:var(--mono); font-size:20px; color:var(--ink-3); white-space:nowrap; letter-spacing:.06em; }
/* 片尾 */
#end .text { position:absolute; left:0; right:0; top:330px; text-align:center; }
#end h1 { font-size:112px; }
#end .rule { margin:56px auto 46px; }
.facts { display:flex; justify-content:center; gap:0; font-size:30px; color:var(--ink-2); }
.facts div { padding:0 44px; border-left:2px solid var(--grid-strong); }
.facts div:first-child { border-left:none; }
.facts b { font-family:var(--mono); color:var(--ink); font-weight:600; margin-right:8px; }
.url { margin-top:70px; font-family:var(--mono); font-size:34px; color:var(--ink-2); letter-spacing:.06em; }
/* 字幕卡（透明底） */
.cap-card { position:absolute; left:96px; bottom:92px; background:rgba(242,244,240,.96); border-top:5px solid var(--ink);
  padding:26px 40px 30px 36px; box-shadow:0 18px 40px rgba(0,0,0,.35); min-width:420px; }
.cap-card.r { left:auto; right:96px; }
.cap-card .no { font-family:var(--mono); font-size:20px; color:var(--laser); letter-spacing:.2em; margin-bottom:10px; }
.cap-card .t { font-family:var(--serif); font-weight:900; font-size:52px; letter-spacing:.08em; line-height:1.2; }
.cap-card .d { font-size:23px; color:var(--ink-2); margin-top:12px; letter-spacing:.04em; }
.tag { position:absolute; left:96px; bottom:92px; display:flex; align-items:stretch; box-shadow:0 12px 30px rgba(0,0,0,.4); }
.tag .k { background:var(--laser); color:#fff; font-family:var(--mono); font-size:20px; padding:0 18px; display:flex; align-items:center; letter-spacing:.1em; }
.tag .v { background:rgba(242,244,240,.96); font-family:var(--serif); font-weight:900; font-size:36px; padding:14px 30px 14px 24px; letter-spacing:.08em; }
.tag .v small { font-family:var(--sans); font-weight:400; font-size:21px; color:var(--ink-2); margin-left:18px; letter-spacing:.03em; }

/* 竖版 1080×1920 */
br.vbr { display:none; } body.v br.vbr { display:inline; }
body.v { width:1080px; height:1920px; }
html:has(body.v) { width:1080px; height:1920px; }
body.v #title .text { left:0; right:0; top:1010px; text-align:center; }
body.v #title h1 { font-size:118px; }
body.v #title .rule { margin:48px auto 34px; }
body.v .eye { left:50%; right:auto; top:330px; width:560px; height:560px; margin-left:-280px; }
body.v .eye canvas { left:28px; top:28px; width:504px; height:504px; }
body.v .eye .cap { bottom:-56px; }
body.v #end .text { top:560px; }
body.v #end h1 { font-size:104px; line-height:1.25; }
body.v .facts { flex-wrap:wrap; width:760px; margin:0 auto; row-gap:26px; font-size:34px; }
body.v .facts div { width:50%; box-sizing:border-box; padding:0; border:none; text-align:center; }
body.v .url { margin-top:110px; font-size:36px; }
body.v .cap-card { left:60px; right:60px; bottom:420px; min-width:0; padding:30px 40px 34px; }
body.v .cap-card.r { left:60px; right:60px; }
body.v .cap-card .t { font-size:60px; }
body.v .cap-card .d { font-size:30px; }
body.v .tag { left:60px; bottom:420px; }
body.v .tag .k { font-size:24px; }
body.v .tag .v { font-size:44px; padding:16px 28px 16px 22px; white-space:nowrap; letter-spacing:.04em; }
body.v .tag .k { white-space:nowrap; }
body.v .tag .v small { display:block; margin:6px 0 0; font-size:26px; }
</style></head>
<body>
<div class="card" id="title">
  <div class="text">
    <div class="eyebrow a" id="t-eb">力学 · 热学 · 电磁学 · 光学 · 近代物理</div>
    <h1 class="a" id="t-h1">大学物理实验<br><em>虚拟仿真</em>实验室</h1>
    <div class="rule" id="t-rule"></div>
    <div class="sub a" id="t-sub">在浏览器里，亲手做一遍真实的实验</div>
  </div>
  <div class="eye a" id="t-eye"><canvas id="rings" width="504" height="504"></canvas><div class="cap">He-Ne 632.8 nm · 等倾干涉 · 实时计算</div></div>
</div>
<div class="card" id="end">
  <div class="text">
    <h1 class="a" id="e-h1">大学物理实验<br class="vbr"><em>虚拟仿真</em>实验室</h1>
    <div class="rule" id="e-rule"></div>
    <div class="facts a" id="e-facts"><div><b>64</b>个实验</div><div>浏览器打开即用</div><div>可完全离线运行</div><div>学习与教学免费</div></div>
    <div class="url a" id="e-url">kami0410 / physics-virtual-lab</div>
  </div>
</div>
<div class="card" id="cap"></div>
<script>
const q = new URLSearchParams(location.search);
const card = q.get('card') || 'title';
if (q.get('v')) document.body.classList.add('v');
const ease = (x) => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);
const $ = (id) => document.getElementById(id);
function fade(el, t, t0, dur = 700, dy = 24) { const k = ease((t - t0) / dur); el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * dy}px)`; }

if (card === 'cap') {
  document.body.classList.add('clear');
  const c = $('cap'); c.classList.add('on');
  if (q.get('kind') === 'tag') c.innerHTML = `<div class="tag"><div class="k">${q.get('k') || ''}</div><div class="v">${q.get('t')}${q.get('d') ? `<small>${q.get('d')}</small>` : ''}</div></div>`;
  else c.innerHTML = `<div class="cap-card${q.get('pos') === 'r' ? ' r' : ''}"><div class="no">${q.get('no') || ''}</div><div class="t">${q.get('t')}</div>${q.get('d') ? `<div class="d">${q.get('d')}</div>` : ''}</div>`;
} else {
  $(card).classList.add('on');
  const cv = $('rings'), g = cv.getContext('2d'), img = g.createImageData(504, 504);
  function rings(t) {
    // 等倾干涉：I ∝ cos²(π·2d·cosθ/λ)，d 随时间增大，圆环从中心冒出
    const N = 504, ph = t * 0.0021;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const dx = (x - N / 2) / (N / 2), dy = (y - N / 2) / (N / 2), r2 = dx * dx + dy * dy;
      const i = (y * N + x) * 4;
      const v = Math.cos(Math.PI * (6.2 * r2 - ph)) ** 2 * Math.exp(-r2 * 0.6);
      img.data[i] = 30 + 225 * v; img.data[i + 1] = 18 + 30 * v * v; img.data[i + 2] = 22 + 28 * v * v; img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  }
  function frame() {
    const t = performance.now();
    if (card === 'title') {
      rings(t);
      fade($('t-eye'), t, 0, 1000, 0);
      fade($('t-eb'), t, 300);
      fade($('t-h1'), t, 550, 900, 36);
      $('t-rule').style.width = ease((t - 1300) / 900) * 760 + 'px';
      fade($('t-sub'), t, 1700);
    } else {
      fade($('e-h1'), t, 0, 900, 30);
      $('e-rule').style.width = ease((t - 500) / 900) * 680 + 'px';
      fade($('e-facts'), t, 900);
      fade($('e-url'), t, 1500);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
</script>
</body></html>
